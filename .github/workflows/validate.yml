name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # The brands check requires this integration to be listed in the
          # home-assistant/brands repository, which is an external PR with its own review
          # queue. Ignored until that PR merges so a pending third-party review does not
          # read as a red build; REMOVE this line the day the brands entry lands.
          ignore: brands
